# Pings the Telegram bot's cron endpoint every 15 minutes. Vercel Hobby crons
# only run daily, so this drives the time-sensitive tasks (occupancy capture,
# rating prompts, PVR cache warming). The daily Vercel cron remains as a backstop.
#
# Schedule uses offset minutes: GitHub deprioritizes scheduled workflows firing
# on :00/:15/:30/:45 (the congested slots) — */15 here was really running only
# every 60-105 minutes. Odd minutes get picked up far more reliably.
name: telegram-cron
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping cron endpoint
        run: |
          curl -fsS --max-time 90 \
            "https://movie-log-eight.vercel.app/api/telegram/cron?secret=${{ secrets.CRON_SECRET }}" \
            | head -c 500
