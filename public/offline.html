<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline · CinemaLog</title>
    <!-- No webfont and no external asset: this page has to render with the
         network already gone, so it uses system fonts and one inline icon. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 340px;
        padding: 40px 28px;
        border: 1px solid #27272a;
        border-radius: 20px;
        background: rgba(24, 24, 27, 0.6);
      }
      svg { width: 72px; height: 72px; }
      h1 {
        margin: 22px 0 10px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 0 0 22px; color: #a1a1aa; font-size: 15px; line-height: 1.55; }
      button {
        width: 100%;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        color: #09090b;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <main class="card">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbbf24" />
            <stop offset="1" stop-color="#f59e0b" />
          </linearGradient>
          <clipPath id="board">
            <rect x="86" y="168" width="340" height="248" rx="30" />
          </clipPath>
        </defs>
        <g transform="translate(256 256) translate(-256 -288)">
          <rect x="86" y="168" width="340" height="248" rx="30" fill="url(#gold)" />
          <g clip-path="url(#board)">
            <rect x="86" y="168" width="340" height="88" fill="#09090b" />
            <g fill="url(#gold)">
              <path d="M124 160 h44 l-30 104 h-44 Z" />
              <path d="M204 160 h44 l-30 104 h-44 Z" />
              <path d="M284 160 h44 l-30 104 h-44 Z" />
              <path d="M364 160 h44 l-30 104 h-44 Z" />
            </g>
          </g>
          <path d="M232 296 l72 44 -72 44 Z" fill="#09090b" />
        </g>
      </svg>
      <h1>No Signal</h1>
      <p>
        CinemaLog needs a connection — your log lives on the server, so nothing
        is cached on this device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
